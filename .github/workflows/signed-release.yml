name: Signed release AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Check secrets
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: test -n "$K" && test -n "$SP" && test -n "$A" && test -n "$KP"
      - name: Decode keystore
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed release
        env:
          SIGN_STORE: ${{ runner.temp }}/upload.jks
          SIGN_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease
      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/*.aab | grep 'jar verified'
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-SIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
