name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Unsigned AAB
        run: gradle --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
