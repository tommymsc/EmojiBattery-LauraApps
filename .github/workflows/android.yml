name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Resource and privacy checks
        run: python3 scripts/check_android_project.py
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Build unsigned release AAB
        run: gradle --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-v1.6.1-UNSIGNED-AAB-NOT-FOR-PLAY
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged permissions and native libraries
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          if unzip -Z1 "$APK" | grep -E '^lib/.*[.]so$'; then
            echo "::error::Native libraries detected: check 16 KB page-size compatibility."
            exit 1
          fi
          PERMISSIONS=$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions "$APK")
          echo "$PERMISSIONS"
          echo "$PERMISSIONS" | grep -q "android.permission.SET_WALLPAPER"
          if echo "$PERMISSIONS" | grep -E 'android.permission.(INTERNET|READ_CONTACTS|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE)'; then
            echo "::error::Unexpected packaged permission"
            exit 1
          fi
      - name: Verify APK signature and version
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package: name='com.lauraapps.emojibattery' versionCode='8'"
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-v1.6.1-HD-LOCKSCREEN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
