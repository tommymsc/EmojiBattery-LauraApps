name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Resource and privacy checks
        run: python3 scripts/check_android_project.py
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Unsigned AAB
        run: gradle --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signing and version
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package: name='com.lauraapps.emojibattery' versionCode='7'"
      - uses: actions/upload-artifact@v4
        with:
          name: EmojiBattery-v1.5.0-ILLUSTRATED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
